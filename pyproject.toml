[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webgpt-as-codex"
version = "0.1.0"
description = "Turn a web AI session into a durable local coding/control plane through MCP."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "WebGPT-as-Codex Contributors"}]
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.15"]

[project.scripts]
webgpt-codex = "webgpt_as_codex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
