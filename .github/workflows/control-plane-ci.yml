name: Control Plane CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Control-plane regression gate
        run: >-
          python -m pytest -q
          tests/test_skill_workflow.py
          tests/test_manager.py
          tests/test_stage18.py
          tests/test_skill_contract.py
          tests/test_unified_skill_release.py
      - name: Ruff
        run: python -m ruff check .
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Full-suite Linux compatibility evidence
        continue-on-error: true
        run: python -m pytest -q
